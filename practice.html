<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">Mental Math Lab</div>

        <div class="links">
            <button class="menuBtn" onclick="toggleMenu()" aria-label="Open menu">&#9776;</button>
            <button class="closeBtn" onclick="toggleMenu()" aria-label="Close menu">&#10005;</button>
            <ul id="menu">
                <li><a href="index.html">Tricks</a></li>
                <li><a href="practice.html">Practice</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="catergories">
            <button class="active">Add</button>
            <button>Subtract</button>
            <button>Multiply</button>
            <button>Divide</button>
        </div>

        <div class="range">
            <div class="num-group">
                <span>First Number</span>
                <div class="inputs">
                    <label for="">
                        <span>Min:</span>
                        <input type="number" class="range-input" id="min-num1" value="1" min="1" max="999">
                    </label>
                    <span class="range-separator">to</span>
                    <label for="">
                        <span>Max:</span>
                        <input type="number" class="range-input" id="max-num1" value="10" min="1" max="999">
                    </label>
                </div>
            </div>

            <div class="spacer"></div>

            <div class="num-group">
                <span>Second Number</span>
                <div class="inputs">
                    <label for="">
                        <span>Min:</span>
                        <input type="number" class="range-input" id="min-num2" value="1" min="1" max="999">
                    </label>
                    <span class="range-separator">to</span>
                    <label for="">
                        <span>Max:</span>
                        <input type="number" class="range-input" id="max-num2" value="10" min="1" max="999">
                    </label>
                </div>

            </div>
        </div>
            
        <div class="workspace">
            <h1 class="equation" id="equation">
                <span id="num1">67</span>
                <span id="operator">+</span>
                <span id="num2">41</span>

            </h1>

            <input type="number" name="" id="user-answer" placeholder="your answer" autofocus>
        </div>

    </main>

    <footer>
        <p>0 streak</p>
        <p>0% accuracy</p>
        <p>2.3s avg time</p>
    </footer>
    
    <script src="script.js"></script>
    <script src="practice.js"></script>
</body>
</html>
