<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tricks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">Mental Math Lab</div>

        <div class="links">
            <button class="menuBtn" onclick="toggleMenu()" aria-label="Open menu">&#9776;</button>
            <button class="closeBtn" onclick="toggleMenu()" aria-label="Close menu">&#9746;</button>
            <ul id="menu">
                <li><a href="#">Tricks</a></li>
                <li><a href="#">Practice</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <h1>Tricks library</h1>
        <p>Pick a trick, learn how to do it, then practice it.</p>

        <div class="filters">
            <button data-filter="all">All</button>
            <div class="spacer"></div>
            <button data-filter="addition">Add</button>
            <button data-filter="subtraction">Subtract</button>
            <button data-filter="multiplication">Multiply</button>
            <button data-filter="division">Divide</button>
        </div>

        <div class="gallery">

            <div class="card">
                <h2>Multiply by 11</h2>
                <p>Learn how to multiply any two-digit number by 11 in your head.</p>
                <div class="card-footer">
                    <div class="tags">
                        <span class="easy-difficulty">easy</span>
                        <span>·</span>
                        <span class="multi-category">multiplication</span>
                    </div>
                    <button class="start-btn">Start</button>
                </div>
            </div>

        </div>

    </main>
    
    <script src="script.js"></script>
</body>
</html>
