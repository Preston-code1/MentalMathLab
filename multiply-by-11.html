<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tricks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">Mental Math Lab</div>

        <div class="links">
            <button class="menuBtn" onclick="toggleMenu()" aria-label="Open menu">&#9776;</button>
            <button class="closeBtn" onclick="toggleMenu()" aria-label="Close menu">&#10005;</button>
            <ul id="menu">
                <li><a href="index.html">Tricks</a></li>
                <li><a href="practice.html">Practice</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </div>
    </nav>

    <div class="lesson-tabs">
        <button class="lesson-tab active" id="learn-btn">Learn</button>
        <div class="tab-divider"></div>
        <button class="lesson-tab" id="practice-btn">Practice</button>
    </div>

    <main class="explaination" id="explaination">
        <section class="example">
            <h1>34 x 11</h1>

            <p>Split the digits:</p>

            <div class="digits">
                <span>3</span>
                <span>4</span>
            </div>

            <p>Add them together:</p>

            <div class="addition">
                <span>3</span>
                <span>+</span>
                <span>4</span>
                <span>=</span>
                <span>7</span>
            </div>

            <p>Put the sum in the middle</p>

            <div class="answer">
                <span>3</span>
                <span class="middle">7</span>
                <span>4</span>
            </div>

            <h2>= 374</h2>
        </section>
        <hr>
        <section class="example">
            <h1>57 x 11</h1>

            <p>If the digits add to more than 10:</p>

            <div class="digits">
                <span>5</span>
                <span>7</span>
            </div>

            <p>Add them together:</p>

            <div class="addition">
                <span>5</span>
                <span>+</span>
                <span>7</span>
                <span>=</span>
                <span>12</span>
            </div>

            <p>Carry the 1:</p>

            <div class="carry">
                <span>6</span>
                <span>2</span>
                <span>7</span>
            </div>

            <h2>= 627</h2>
        </section>
        
    </main>
    
    <main>
        <section id="practice" class="hidden">
            <h1 class="practice-title">Practice</h1>
    
            <div class="workspace">
                <h1 class="equation" id="equation">
                    <span id="num1"></span>
                    <span id="operator">x</span>
                    <span id="num2">11</span>
    
                </h1>
    
                <input type="number" id="user-answer" placeholder="your answer" autofocus>
            </div>
        </section>

    </main>

    <footer class="footer-trick">
        <a href="index.html">
            <button>exit</button>
        </a>
        <button id="next-btn">next</button>
    </footer>

    <script src="script.js"></script>
    <script src="tricks.js"></script>
</body>
</html>
